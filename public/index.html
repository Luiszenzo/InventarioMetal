<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#F97316" />
  <meta name="description" content="Sistema de inventario para Cocina y Barra del restaurante" />
  <title>Inventario Restaurante</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/styles.css" />

  <!-- jsPDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.3/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<div id="app">
  <!-- ===== HEADER ===== -->
  <header class="app-header" id="inv-header">
    <div class="header-left">
      <button class="btn-back" id="header-back" onclick="goBack()" style="display:none" title="Volver">←</button>
      <span class="header-title" id="inv-title">Inventario</span>
    </div>
    <div class="header-right">
      <span class="header-user" id="header-user"></span>
      <div id="menu-admin" style="display:none">
        <button class="btn-admin" onclick="openAdmin('reports')">⚙️ Admin</button>
      </div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </header>

  <!-- ===== VIEW: SELECTOR ===== -->
  <section class="view" id="view-selector">
    <p class="selector-title">¿Qué inventario vas a hacer?</p>
    <p class="selector-sub">Selecciona la sección</p>
    <div class="selector-cards">
      <button class="selector-card cocina" onclick="selectSection('cocina')" id="btn-cocina">
        <span class="selector-card-icon">🍳</span>
        <div class="selector-card-info">
          <span class="selector-card-label">Cocina</span>
          <span class="selector-card-desc">Ingredientes y utensilios de cocina</span>
        </div>
        <span class="selector-card-arrow">›</span>
      </button>

      <button class="selector-card barra" onclick="selectSection('barra')" id="btn-barra">
        <span class="selector-card-icon">🍹</span>
        <div class="selector-card-info">
          <span class="selector-card-label">Barra</span>
          <span class="selector-card-desc">Bebidas, licores y mixers</span>
        </div>
        <span class="selector-card-arrow">›</span>
      </button>

      <button class="selector-card tienda" onclick="selectSection('tienda')" id="btn-tienda">
        <span class="selector-card-icon">👕</span>
        <div class="selector-card-info">
          <span class="selector-card-label">Tienda</span>
          <span class="selector-card-desc">Prendas de ropa y artículos de la tienda</span>
        </div>
        <span class="selector-card-arrow">›</span>
      </button>

      <button class="selector-card propinas" onclick="selectSection('propinas')" id="btn-propinas">
        <span class="selector-card-icon">💵</span>
        <div class="selector-card-info">
          <span class="selector-card-label">Propinas</span>
          <span class="selector-card-desc">Registro y gestión de propinas del restaurante</span>
        </div>
        <span class="selector-card-arrow">›</span>
      </button>
    </div>
  </section>

  <!-- ===== VIEW: INVENTORY ===== -->
  <section class="view" id="view-inventory">
    <div class="inv-loading" id="inv-loading" style="display:none">
      <div class="loading-spinner"></div>
    </div>
    <div class="inv-content">
      <div id="inv-list"></div>
    </div>

    <!-- FAB: Add product -->
    <button class="fab" id="inv-fab" onclick="openAddProduct()" title="Agregar producto">+</button>

    <!-- Submit report button -->
    <button class="btn-submit" id="inv-submit-btn" onclick="doSubmitReport()">
      📤 Enviar Reporte del Día
    </button>
  </section>

  <!-- ===== VIEW: ADMIN ===== -->
  <section class="view" id="view-admin">
    <div class="admin-content">
      <!-- Tabs -->
      <div class="admin-tabs">
        <button class="admin-tab-btn active" id="tab-btn-reports" onclick="switchAdminTab('reports')">📄 Reportes</button>
        <button class="admin-tab-btn" id="tab-btn-users" onclick="switchAdminTab('users')">👥 Usuarios</button>
      </div>

      <!-- Reports panel -->
      <div class="admin-tab-panel active" id="tab-reports">
        <div class="filter-row">
          <button class="filter-btn active" onclick="filterReports('all')">Todos</button>
          <button class="filter-btn" onclick="filterReports('cocina')">🍳 Cocina</button>
          <button class="filter-btn" onclick="filterReports('barra')">🍹 Barra</button>
          <button class="filter-btn" onclick="filterReports('tienda')">👕 Tienda</button>
        </div>
        <div id="reports-list"></div>
      </div>

      <!-- Users panel -->
      <div class="admin-tab-panel" id="tab-users">
        <button class="admin-add-btn" onclick="openNewUser()">+ Nuevo empleado</button>
        <div id="users-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== VIEW: PROPINAS ===== -->
  <section class="view" id="view-propinas">
    <div class="propinas-content">
      <!-- Tabs -->
      <div class="propinas-tabs">
        <button class="propinas-tab-btn active" id="tab-btn-prop-registrar" onclick="switchPropinasTab('registrar')">💵 Registrar</button>
        <button class="propinas-tab-btn" id="tab-btn-prop-historial" onclick="switchPropinasTab('historial')">📅 Historial y Resumen</button>
        <button class="propinas-tab-btn" id="tab-btn-prop-reportes" onclick="switchPropinasTab('reportes')">📋 Reportes</button>
      </div>

      <!-- Registrar panel -->
      <div class="propinas-tab-panel active" id="tab-prop-registrar">
        <form id="registrar-ticket-form" class="form-stack">
          <label class="form-label">Fecha del Ticket *
            <input class="form-input" id="pt-fecha" type="date" required />
          </label>
          <label class="form-label">Monto de Propina *
            <div class="monto-input-wrapper">
              <span class="monto-symbol">$</span>
              <input class="form-input" id="pt-monto" type="number" step="0.01" min="0.01" placeholder="0.00" required />
            </div>
          </label>
          <label class="form-label">Empleados Participantes *
            <div class="empleados-checklist-grid" id="pt-empleados-grid">
              <!-- Cargado dinámicamente -->
            </div>
          </label>
          <button type="submit" class="btn-primary" style="background: var(--success)">Agregar Ticket</button>
        </form>
      </div>

      <!-- Historial panel -->
      <div class="propinas-tab-panel" id="tab-prop-historial">
        <!-- Filtros y Buscador -->
        <div class="search-filters-row">
          <div class="filter-group">
            <span class="filter-label">Agrupar por:</span>
            <div class="btn-group-toggle">
              <button class="toggle-btn active" id="group-btn-day" onclick="setGroupFilter('day')">Día</button>
              <button class="toggle-btn" id="group-btn-week" onclick="setGroupFilter('week')">Semana</button>
              <button class="toggle-btn" id="group-btn-month" onclick="setGroupFilter('month')">Mes</button>
              <button class="toggle-btn" id="group-btn-year" onclick="setGroupFilter('year')">Año</button>
            </div>
          </div>
          
          <div class="filter-inputs-grid">
            <label class="form-label">Filtrar por Fecha
              <input class="form-input" id="filter-date" type="date" onchange="applyFilters()" />
            </label>
            <label class="form-label">Buscar por Empleado
              <select class="form-input" id="filter-empleado" onchange="applyFilters()">
                <option value="">Todos los empleados</option>
              </select>
            </label>
          </div>
        </div>

        <!-- Tabla Resumen Semanal -->
        <div class="summary-section">
          <h3 class="section-title-sm">Tabla de Resumen Semanal</h3>
          <div class="table-responsive">
            <table class="summary-table" id="prop-weekly-table">
              <thead>
                <tr>
                  <th>Semana</th>
                  <th>Total</th>
                  <th>Desglose por Empleado</th>
                </tr>
              </thead>
              <tbody id="prop-weekly-tbody">
                <!-- Se llena dinámicamente -->
              </tbody>
            </table>
          </div>
        </div>

        <div class="tickets-grouped-list" id="tickets-list">
          <!-- Se llena dinámicamente -->
        </div>
      </div>

      <!-- Reportes panel -->
      <div class="propinas-tab-panel" id="tab-prop-reportes">
        <form id="reportes-form" class="form-stack">
          <label class="form-label">Tipo de Reporte *
            <select class="form-input" id="rep-tipo" onchange="handleReportTypeChange(this.value)">
              <option value="diario">Diario</option>
              <option value="semanal">Semanal</option>
              <option value="mensual">Mensual</option>
              <option value="personalizado">Rango Personalizado</option>
            </select>
          </label>

          <div id="rep-param-diario-wrap">
            <label class="form-label">Día del Reporte *
              <input class="form-input" id="rep-fecha-dia" type="date" />
            </label>
          </div>

          <div id="rep-param-semanal-wrap" style="display:none">
            <label class="form-label">Selecciona un día de la semana a reportar *
              <input class="form-input" id="rep-fecha-semana" type="date" />
            </label>
          </div>

          <div id="rep-param-mensual-wrap" style="display:none">
            <label class="form-label">Mes a reportar *
              <input class="form-input" id="rep-fecha-mes" type="month" />
            </label>
          </div>

          <div id="rep-param-rango-wrap" style="display:none">
            <div class="filter-inputs-grid">
              <label class="form-label">Desde *
                <input class="form-input" id="rep-fecha-inicio" type="date" />
              </label>
              <label class="form-label">Hasta *
                <input class="form-input" id="rep-fecha-fin" type="date" />
              </label>
            </div>
          </div>

          <div class="report-actions-row">
            <button type="button" class="btn-primary" onclick="exportTipsReport('pdf')" style="background: #DE2727">📄 Exportar PDF</button>
            <button type="button" class="btn-primary" onclick="exportTipsReport('csv')" style="background: #10B981">📊 Exportar CSV</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</div>

<!-- ===== MODAL ===== -->
<div id="modal-overlay">
  <div id="modal-content">
    <div id="modal-body"></div>
  </div>
</div>

<!-- ===== TOASTS ===== -->
<div id="toast-container"></div>

<script>
  // Show/hide back button based on active view
  const backBtn = document.getElementById('header-back');
  const observer = new MutationObserver(() => {
    const onSelector = document.getElementById('view-selector').classList.contains('active');
    backBtn.style.display = onSelector ? 'none' : 'flex';
  });
  observer.observe(document.getElementById('app'), { subtree: true, attributes: true, attributeFilter: ['class'] });
</script>

<script type="module" src="/js/ui.js"></script>
<script type="module" src="/js/app.js"></script>
</body>
</html>
